<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CIBUS LORE — Article</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f6ee;
      color: #26352b;
      font-family: Georgia, serif;
    }

    header {
      background: white;
      border-bottom: 1px solid #eee;
      padding: 25px 45px;
    }

    .logo {
      font-size: 32px;
      color: #26352b;
      text-decoration: none;
    }

    main {
      max-width: 900px;
      margin: 70px auto;
      padding: 0 25px;
    }

    .tag {
      color: #65b94d;
      font-family: Arial, sans-serif;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 52px;
      line-height: 1.1;
      margin: 18px 0;
    }

    .description {
      font-size: 21px;
      color: #68736b;
      line-height: 1.6;
      margin-bottom: 45px;
    }

    .content {
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.9;
      color: #37443b;
      white-space: pre-wrap;
    }

    .back {
      display: inline-block;
      margin-top: 50px;
      color: #65b94d;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-weight: bold;
    }

    .message {
      text-align: center;
      font-family: Arial, sans-serif;
      color: #68736b;
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">CIBUS LORE</a>
</header>

<main>

  <div id="article">
    <div class="message">Loading article...</div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://ssyxewjbeuldapinvomt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_37_Z0Y95PSX6xMIcDzq2Tw_RF_BjtqP";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function loadArticle() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");
  const articleBox = document.getElementById("article");

  if (!slug) {
    articleBox.textContent = "Article link is missing its slug.";
    return;
  }

  articleBox.textContent = "Loading article...";

  try {
    const request = supabaseClient
      .from("articles")
      .select("title, description, content, slug")
      .eq("slug", slug)
      .order("created_at" { ascending: false})
      .limit(1)
      .maybeSingle();

    const timeout = new Promise((_, reject) =>
      setTimeout(() => reject(new Error("timeout")), 10000)
    );

    const { data, error } = await Promise.race([request, timeout]);

    if (error || !data) {
      articleBox.textContent =
        "Could not load the article. Please refresh and try again.";
      console.error("Supabase article error:", error);
      return;
    }

    document.title = "CIBUS LORE — " + data.title;

    const tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = "FOOD STORY";

    const title = document.createElement("h1");
    title.textContent = data.title || "";

    const description = document.createElement("div");
    description.className = "description";
    description.textContent = data.description || "";

    const content = document.createElement("div");
    content.className = "content";
    content.textContent = data.content || "";

    const back = document.createElement("a");
    back.className = "back";
    back.href = "index.html";
    back.textContent = "← Back to CIBUS LORE";

    articleBox.replaceChildren(tag, title, description, content, back);

  } catch (err) {
    articleBox.textContent =
      "The article is taking too long to load. Check your connection and try again.";
    console.error("Article loading failed:", err);
  }
}

loadArticle();
  
</script>
</body>
</html>
