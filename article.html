<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#f8f6ee">
  <meta name="description" content="Discover the story behind what we eat with CIBUS LORE.">

  <title>CIBUS LORE — Article</title>

  <style>
    :root {
      --cream: #f8f6ee;
      --white: #ffffff;
      --green: #26352b;
      --accent: #65a84f;
      --muted: #68736b;
      --line: #e8e6dd;
      --body: #37443b;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 24px;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--green);
      font-family: Georgia, "Times New Roman", serif;
    }

    a {
      color: inherit;
    }

    .site-header {
      background: var(--white);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      max-width: 1180px;
      min-height: 82px;
      margin: auto;
      padding: 22px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: normal;
      letter-spacing: -1px;
      text-decoration: none;
    }

    .home-link {
      font: 600 13px Arial, sans-serif;
      text-decoration: none;
      color: var(--muted);
    }

    .home-link:hover,
    .back-link:hover {
      color: var(--accent);
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 42px 30px 80px;
    }

    .breadcrumb {
      margin-bottom: 32px;
      font: 13px Arial, sans-serif;
      color: var(--muted);
    }

    .breadcrumb a {
      text-decoration: none;
    }

    .hero-image {
      width: 100%;
      height: clamp(240px, 43vw, 490px);
      display: block;
      object-fit: cover;
      border-radius: 5px;
      background: #e9e5d9;
    }

    .article-heading {
      max-width: 820px;
      margin: 38px auto 48px;
    }

    .tag {
      color: var(--accent);
      font: 700 12px Arial, sans-serif;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 20px;
      font-size: clamp(35px, 5.6vw, 64px);
      line-height: 1.08;
      letter-spacing: -1.5px;
      overflow-wrap: anywhere;
    }

    .description {
      max-width: 740px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(18px, 2.5vw, 23px);
      line-height: 1.65;
    }

    .reading-layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      align-items: start;
      gap: 58px;
    }

    .toc {
      position: sticky;
      top: 24px;
      padding: 22px 18px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 5px;
    }

    .toc h2 {
      margin: 0 0 17px;
      font: 700 12px Arial, sans-serif;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .toc ol {
      margin: 0;
      padding-left: 19px;
    }

    .toc li {
      margin: 0 0 13px;
      color: var(--muted);
      font: 13px/1.6 Arial, sans-serif;
    }

    .toc a {
      text-decoration: none;
    }

    .toc a:hover {
      color: var(--accent);
    }

    .toc-empty {
      color: var(--muted);
      font: 13px/1.6 Arial, sans-serif;
    }

    .article-content {
      min-width: 0;
      color: var(--body);
      font: 17px/1.95 Arial, sans-serif;
      overflow-wrap: anywhere;
    }

    .article-content p {
      margin: 0 0 24px;
    }

    .article-content h2 {
      margin: 44px 0 17px;
      padding-top: 8px;
      color: var(--green);
      font: 700 clamp(23px, 3vw, 30px)/1.3 Georgia, serif;
      scroll-margin-top: 25px;
    }

    .article-content h3 {
      margin: 30px 0 12px;
      color: var(--green);
      font: 700 21px/1.4 Georgia, serif;
    }

    .article-content ul,
    .article-content ol {
      padding-left: 25px;
      margin: 0 0 26px;
    }

    .article-content li {
      padding-left: 4px;
      margin-bottom: 8px;
    }

    .article-content a {
      color: var(--accent);
    }

    .article-footer {
      max-width: 820px;
      margin: 55px auto 0;
      padding-top: 25px;
      border-top: 1px solid var(--line);
    }

    .back-link {
      color: var(--accent);
      font: 700 14px Arial, sans-serif;
      text-decoration: none;
    }

    .loading,
    .error {
      max-width: 700px;
      margin: 90px auto;
      padding: 35px 20px;
      text-align: center;
      font: 16px/1.8 Arial, sans-serif;
      color: var(--muted);
    }

    .retry-link {
      display: inline-block;
      margin-top: 12px;
      color: var(--accent);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 760px) {
      .header-inner {
        min-height: 72px;
        padding: 18px 20px;
      }

      .logo {
        font-size: 25px;
      }

      .page {
        padding: 25px 19px 55px;
      }

      .breadcrumb {
        margin-bottom: 22px;
      }

      .hero-image {
        height: 260px;
      }

      .article-heading {
        margin: 28px 0 32px;
      }

      h1 {
        letter-spacing: -0.7px;
      }

      .reading-layout {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .toc {
        position: static;
        padding: 19px;
      }

      .article-content {
        font-size: 16px;
        line-height: 1.85;
      }

      .article-content h2 {
        margin-top: 34px;
      }

      .article-footer {
        margin-top: 40px;
      }
    }

    @media (max-width: 380px) {
      .home-link {
        font-size: 12px;
      }

      .hero-image {
        height: 210px;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="index.html">CIBUS LORE</a>
    <a class="home-link" href="index.html">← Back to stories</a>
  </div>
</header>

<main class="page">

  <div id="loading" class="loading">Loading your food story...</div>

  <div id="article" hidden>
    <div class="breadcrumb">
      <a href="index.html">Home</a> / <span>Food Story</span>
    </div>

    <img id="cover" class="hero-image" alt="" />

    <section class="article-heading">
      <div class="tag">Food Story</div>
      <h1 id="title"></h1>
      <p id="description" class="description"></p>
    </section>

    <div class="reading-layout">
      <nav class="toc" aria-label="Table of contents">
        <h2>In this story</h2>
        <div id="toc-list"></div>
      </nav>

      <article id="content" class="article-content"></article>
    </div>

    <footer class="article-footer">
      <a class="back-link" href="index.html">← Back to CIBUS LORE</a>
    </footer>
  </div>

  <div id="error" class="error" hidden>
    <p id="error-message">We couldn't load this story.</p>
    <a class="retry-link" href="" onclick="location.reload(); return false;">
      Try again
    </a>
    <p><a class="back-link" href="index.html">← Back to CIBUS LORE</a></p>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://ssyxewjbeuldapinovmt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_37_Z0Y95PSX6xMIcDzq2Tw_RF_BjtqP";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const $ = (id) => document.getElementById(id);

function showError(message) {
  $("loading").hidden = true;
  $("article").hidden = true;
  $("error").hidden = false;
  $("error-message").textContent = message;
}

function slugify(text) {
  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

function createCover(slug) {
  // Use a relevant photograph for apples and a general food photograph
  // for other stories until a cover-image column is added to Supabase.
  if (slug.toLowerCase().includes("apple")) {
    return "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=1800&q=85";
  }

  return "https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=1800&q=85";
}

function formatArticle(rawContent) {
  const contentBox = $("content");
  const tocBox = $("toc-list");

  contentBox.replaceChildren();
  tocBox.replaceChildren();

  const lines = (rawContent || "").replace(/\r\n/g, "\n").split("\n");
  const sections = [];
  let paragraphLines = [];
  let listItems = [];
  let listType = null;

  function flushParagraph() {
    if (!paragraphLines.length) return;

    const paragraph = document.createElement("p");
    paragraph.textContent = paragraphLines.join(" ").trim();
    contentBox.appendChild(paragraph);
    paragraphLines = [];
  }

  function flushList() {
    if (!listItems.length) return;

    const list = document.createElement(listType === "ol" ? "ol" : "ul");

    listItems.forEach((item) => {
      const li = document.createElement("li");
      li.textContent = item;
      list.appendChild(li);
    });

    contentBox.appendChild(list);
    listItems = [];
    listType = null;
  }

  lines.forEach((originalLine) => {
    const line = originalLine.trim();

    if (!line) {
      flushParagraph();
      flushList();
      return;
    }

    // Numbered section headings, optionally preceded by an emoji.
    const headingMatch = line.match(
      /^(?:[\p{Extended_Pictographic}\uFE0F\u200D]+\s*)?(\d+)[.)]\s+(.+)$/u
    );

    if (headingMatch) {
      flushParagraph();
      flushList();

      const heading = document.createElement("h2");
      heading.textContent = headingMatch[2];

      const id = "section-" + slugify(headingMatch[2]) + "-" + sections.length;
      heading.id = id;

      contentBox.appendChild(heading);
      sections.push({ id, title: headingMatch[2] });
      return;
    }

    const bulletMatch = line.match(/^(?:[-*•])\s+(.+)$/);

    if (bulletMatch) {
      flushParagraph();

      if (listType && listType !== "ul") flushList();
      listType = "ul";
      listItems.push(bulletMatch[1]);
      return;
    }

    flushList();
    paragraphLines.push(line);
  });

  flushParagraph();
  flushList();

  if (!sections.length) {
    tocBox.textContent = "Explore the full story below.";
    tocBox.className = "toc-empty";
    return;
  }

  tocBox.className = "";

  const list = document.createElement("ol");

  sections.forEach((section) => {
    const li = document.createElement("li");
    const link = document.createElement("a");

    link.href = "#" + section.id;
    link.textContent = section.title;

    li.appendChild(link);
    list.appendChild(li);
  });

  tocBox.appendChild(list);
}

async function loadArticle() {
  const slug = new URLSearchParams(window.location.search).get("slug");

  if (!slug) {
    showError("This article link is missing its story ID.");
    return;
  }

  const timeoutId = setTimeout(() => {
    if ($("loading").hidden) return;
    showError("The story is taking too long to load. Please check your connection and try again.");
  }, 12000);

  try {
    const { data, error } = await supabaseClient
      .from("articles")
      .select("title, description, content, slug")
      .eq("slug", slug)
      .order("created_at", { ascending: false })
      .limit(1)
      .maybeSingle();

    clearTimeout(timeoutId);

    if (error) {
      console.error("Supabase article error:", error);
      showError("We couldn't retrieve this story. Please try again shortly.");
      return;
    }

    if (!data) {
      showError("This story could not be found.");
      return;
    }

    document.title = "CIBUS LORE — " + (data.title || "Food Story");

    $("title").textContent = data.title || "Untitled Story";
    $("description").textContent = data.description || "";

    const cover = $("cover");
    cover.src = createCover(data.slug || slug);
    cover.alt = data.title || "Food story cover";
    cover.onerror = () => {
      cover.hidden = true;
    };

    formatArticle(data.content || "");

    $("loading").hidden = true;
    $("article").hidden = false;

  } catch (error) {
    clearTimeout(timeoutId);
    console.error("Article loading failed:", error);
    showError("Something went wrong while opening this story. Please try again.");
  }
}

loadArticle();
</script>

</body>
</html>
