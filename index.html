<!DOCTYPE html>
<html lang="en">

<meta name="description"

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #f8f6ee;
  color: #153b29;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

a {
  text-decoration: none;
  color: inherit;
}

img {
  max-width: 100%;
  display: block;
}


/* =========================================================
   HEADER
========================================================= */

.header {
  height: 115px;
  background: #fffef9;
  border-bottom: 1px solid #e7e4dc;

  display: flex;
  align-items: center;

  position: relative;
  z-index: 20;
}

.nav-container {
  width: 100%;
  max-width: 1440px;

  margin: 0 auto;
  padding: 0 58px;

  display: flex;
  align-items: center;

  min-width: 0;
}


/* CIBUS LORE */

.brand {
  flex: 0 0 390px;

  display: flex;
  align-items: center;

  min-width: 0;
}

.brand span {
  font-family: Georgia, "Times New Roman", serif;

  font-size: 42px;
  line-height: 1;

  font-weight: 700;
  letter-spacing: -1px;

  color: #102d22;

  white-space: nowrap;
}


/* =========================================================
   DESKTOP NAV
========================================================= */

.nav {
  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 48px;

  height: 100%;

  min-width: 0;
}

.nav a {
  position: relative;

  height: 100%;

  display: flex;
  align-items: center;

  padding-top: 4px;

  font-size: 17px;
  font-weight: 600;

  color: #172d25;

  white-space: nowrap;
}


/* ACTIVE HOME */

.nav a.active::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;

  bottom: 18px;

  height: 4px;

  background: #6fa95a;

  border-radius: 2px;
}

.nav a:hover {
  color: #075b32;
}


/* =========================================================
   MOBILE MENU
========================================================= */

.mobile-menu {
  display: none;
}


/* =========================================================
   HERO
========================================================= */

.hero {
  height: 640px;

  position: relative;

  overflow: hidden;

  color: white;
}


/* HERO BACKGROUND */

.hero-background {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      90deg,
      rgba(7, 35, 29, 0.92) 0%,
      rgba(8, 42, 34, 0.72) 32%,
      rgba(10, 48, 38, 0.28) 65%,
      rgba(10, 48, 38, 0.08) 100%

    url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=2200&q=90")
    center center / cover no-repeat;
}


/* HERO CONTENT */

.hero-content {
  position: relative;

  z-index: 3;

  max-width: 1440px;

  height: 100%;

  margin: 0 auto;

  padding-left: 145px;
  padding-top: 78px;
}


/* EYEBROW */

.eyebrow {
  font-size: 17px;

  letter-spacing: 9px;

  font-weight: 500;

  margin-bottom: 32px;

  color: #f4f3e9;

  white-space: nowrap;
}


/* MAIN TITLE */

.hero h1 {
  margin: 0;

  font-family: Georgia, "Times New Roman", serif;

  font-size: clamp(70px, 6.2vw, 104px);

  line-height: 0.92;

  letter-spacing: -5px;

  font-weight: 700;

  color: #fffdf5;
}

.hero h1 em {
  color: #83d461;
  font-style: normal;
}


/* DESCRIPTION */

.hero p {
  margin: 28px 0 30px;

  font-size: 25px;

  line-height: 1.45;

  color: #f3f4ef;
}


/* =========================================================
   BUTTON
========================================================= */

.primary-btn {

  align-items: center;

  gap: 32px;

  background: #78c45c;

  color: white;

  padding: 19px 34px;

  border-radius: 40px;

  font-size: 18px;

  font-weight: 700;

  transition: 0.25s ease;
}

.primary-btn span {
  font-size: 28px;
  line-height: 0;
}

.primary-btn:hover {
  background: #67b34d;
  transform: translateY(-2px);
}

   FEATURED STORIES
========================================================= */

.content-section {
  width: 100%;
  max-width: 1270px;

  margin: 55px auto;

  padding: 0 20px;

  min-width: 0;
}

.section-heading {

  justify-content: space-between;
  align-items: center;

  gap: 20px;

  margin-bottom: 28px;
}

  font-size: 48px;

  line-height: 1;

  color: #163b2d;
}

.section-heading a {
  font-size: 15px;

  font-weight: 700;

  white-space: nowrap;
}

   STORY GRID
========================================================= */

.stories-layout {
  display: grid;

  grid-template-columns:
    minmax(0, 2.2fr)
    minmax(250px, 1fr);

  gap: 25px;

  align-items: start;

  width: 100%;

  min-width: 0;
}

.story-grid {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 20px;

  min-width: 0;
}

.story-card {
  background: white;

  border-radius: 18px;

  overflow: hidden;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.06);

  min-width: 0;
}

.story-card img {
  width: 100%;

  height: 180px;

  object-fit: cover;

  display: block;

  background: #e9eee7;
}

   STORY CONTENT
========================================================= */

  padding: 18px;

  padding: 6px 9px;

  border-radius: 15px;

  background: #edf4e9;

  color: #39713c;

  font-size: 9px;

  font-weight: 800;
}

.story-content h3 {

  font-family: Georgia, serif;

  font-size: 20px;

  line-height: 1.15;
}

.story-content p {
  margin: 0;

  color: #69736c;

  font-size: 12px;

  line-height: 1.5;
}

========================================================= */

  margin-bottom: 15px;
}

.aim-card small {

  letter-spacing: 3px;

  color: #75917e;
}

.aim-card h2 {

  font-size: 30px;

  line-height: 1.08;

  margin: 10px 0 15px;
}

.aim-card p {
  color: #68736d;

  line-height: 1.5;

  font-size: 14px;
}

   QUOTE
========================================================= */

  padding: 0 20px;

  align-items: center;
  justify-content: center;

  gap: 25px;

  text-align: center;

  font-size: 75px;

  color: #75a85c;
}

.quote p {

  font-size: 27px;

  line-height: 1.3;

  margin: 0 0 12px;
}

   ABOUT
========================================================= */

  padding: 80px 20px;
}

  margin: auto;

.about p {

  line-height: 1.7;

  color: #58675e;
}

   FOOTER
========================================================= */

  padding: 45px 20px 25px;
